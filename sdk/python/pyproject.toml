[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitechcloud-crm"
version = "1.0.0"
description = "Official HiTechCloud CRM API SDK for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "HiTechCloud Vietnam", email = "support@hitechcloud.vn" }]
keywords = ["hitechcloud", "crm", "api", "sdk", "sales", "contacts", "deals"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23"]

[project.urls]
Homepage = "https://github.com/hitechcloud-vietnam/hitechcloud-crm-sdk"
Documentation = "https://developers.hitechcloud.vn"
Repository = "https://github.com/hitechcloud-vietnam/hitechcloud-crm-sdk"
Issues = "https://github.com/hitechcloud-vietnam/hitechcloud-crm-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hitechcloud_crm*"]
